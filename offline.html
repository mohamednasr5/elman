<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أنت غير متصل بالإنترنت | المنزلة وناسها</title>
  <link rel="stylesheet" href="./src/css/main.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: var(--surface-2);
      font-family: var(--font-arabic);
      text-align: center;
      padding: var(--space-4);
    }
    .offline-card {
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      max-width: 420px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
    }
    .offline-icon {
      font-size: 4rem;
      margin-bottom: var(--space-4);
    }
    .offline-title {
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-extrabold);
      color: var(--text-primary);
      margin-bottom: var(--space-2);
    }
    .offline-desc {
      color: var(--text-secondary);
      margin-bottom: var(--space-6);
      font-size: var(--font-size-base);
    }
  </style>
  <link rel="icon" type="image/x-icon" href="./favicon.ico"/>
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48x48.png"/>
  <link rel="icon" type="image/png" sizes="96x96" href="./icons/icon-96x96.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192x192.png"/>
  <link rel="apple-touch-icon" sizes="192x192" href="./apple-touch-icon.png"/>
  <meta property="og:image" content="https://dalilmanzala.com/og-image.png"/>
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>
  <meta name="twitter:image" content="https://dalilmanzala.com/og-image.png"/>
</head>
<body>
  <div class="offline-card animate-fade-in-up">
    <div class="offline-icon">📡</div>
    <h1 class="offline-title">لا يوجد اتصال بالإنترنت</h1>
    <p class="offline-desc">
      يبدو أن هاتفك غير متصل بالإنترنت حاليًا. الأماكن والمعلومات التي تصفحتها سابقًا محفوظة ومتاحة على جهازك.
    </p>
    <button onclick="window.location.reload()" class="btn btn-primary btn-block">
      🔄 إعادة المحاولة
    </button>
  </div>
</body>
</html>
