<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081522">
  <title>إدارة دليل المنزلة والمطرية — Admin v2</title>
  <link rel="icon" href="../icons/icon-96x96.png">
  <style>
    :root{font-family:Cairo,system-ui,sans-serif;color-scheme:dark;--bg:#07111c;--panel:#0c1b29;--panel2:#102333;--line:#1b3549;--text:#eff6ff;--muted:#93a7b8;--accent:#38bdf8;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#06101a,#091725 40%,#07111c);color:var(--text);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}
    .app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.sidebar{border-left:1px solid var(--line);background:#081522;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:14px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#0e2538,#0a1825);margin-bottom:18px}.brand h1{font-size:18px;margin:0 0 5px}.brand p{margin:0;color:var(--muted);font-size:12px}.nav{display:grid;gap:7px}.nav button{border:1px solid transparent;background:transparent;color:#c9d7e4;text-align:right;padding:12px 13px;border-radius:12px}.nav button.active,.nav button:hover{background:#10283b;border-color:#1c435c;color:#fff}.nav small{color:#6e8496;padding:8px 10px 2px}
    .main{padding:24px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.top h2{margin:0;font-size:25px}.tools{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#102334;color:#fff;border-radius:10px;padding:10px 13px}.btn.primary{background:#0c75a7;border-color:#1094cf}.btn.good{background:#11682d;border-color:#198b3c}.btn.warn{background:#76500a}.btn.bad{background:#752323}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:9px;height:9px;border-radius:50%;background:var(--warn)}.dot.good{background:var(--good)}.dot.bad{background:var(--bad)}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:rgba(12,27,41,.96);border:1px solid var(--line);border-radius:16px;padding:16px}.metric .label{color:var(--muted);font-size:12px}.metric .value{font-size:31px;font-weight:800;margin-top:5px}.metric .sub{font-size:11px;color:#6f9ab4;margin-top:3px}.wide{grid-column:1/-1}.section{margin-top:16px}.section h3{margin:0 0 12px;font-size:15px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px 10px;border-bottom:1px solid #163043;text-align:right;font-size:12px}.table th{color:#9fb3c3;background:#0a1a28;position:sticky;top:0}.table tr:last-child td{border-bottom:none}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;border:1px solid #27465c;color:#cde5f6;background:#0e2232}.badge.good{color:#a7f3d0;border-color:#1b6c42;background:#0a2c1b}.badge.warn{color:#fde68a;border-color:#6f560d;background:#2e2406}.badge.bad{color:#fecaca;border-color:#6d2a2a;background:#321414}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{background:#091724;color:#fff;border:1px solid var(--line);padding:10px 11px;border-radius:10px;min-width:180px}.muted{color:var(--muted)}.error{border:1px solid #6b2929;background:#2a1010;color:#fecaca;padding:13px;border-radius:12px}.ok{border:1px solid #1c6540;background:#092418;color:#bbf7d0;padding:13px;border-radius:12px}.loading{padding:40px;text-align:center;color:var(--muted)}.empty{padding:35px;text-align:center;color:var(--muted)}.pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px}.pagination span{color:var(--muted);font-size:12px}
    .modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.show{display:flex}.modal-card{width:min(820px,100%);max-height:90vh;overflow:auto;background:#0a1926;border:1px solid var(--line);border-radius:18px;padding:18px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#a8bbca}.field input,.field select,.field textarea{background:#07131f;border:1px solid var(--line);color:#fff;padding:10px;border-radius:10px}.modal-actions{display:flex;justify-content:flex-start;gap:8px;margin-top:16px}.notice{font-size:11px;color:#82a4b8;line-height:1.7}
    @media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.app{grid-template-columns:1fr}.sidebar{position:sticky;height:auto;z-index:10;border-left:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.nav small{display:none}}
    @media(max-width:640px){.main{padding:14px}.grid{grid-template-columns:1fr}.modal-grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.tools{width:100%}.tools .btn{flex:1}.toolbar>*{width:100%;min-width:0}}
  </style>
</head>
<body>
<div id="root"><div class="loading">جاري تشغيل لوحة الإدارة الجديدة…</div></div>
<div id="modal" class="modal"><div class="modal-card" id="modal-content"></div></div>
<script type="module" src="./app.js"></script>
</body>
</html>
