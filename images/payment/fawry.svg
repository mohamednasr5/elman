<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="fawryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD633"/>
      <stop offset="50%" stop-color="#FFBF00"/>
      <stop offset="100%" stop-color="#E6A800"/>
    </linearGradient>
    <radialGradient id="fawryGlow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="fawryShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#B38600" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#fawryBg)" filter="url(#fawryShadow)"/>
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#fawryGlow)"/>
  <rect x="7" y="7" width="106" height="106" rx="25" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>

  <!-- Fawry Emblem & Logo -->
  <g transform="translate(18, 16)">
    <!-- White Circle with blue curved arrow -->
    <circle cx="18" cy="28" r="14" fill="#FFFFFF" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.15))"/>
    <path d="M12 34 C12 26 18 22 25 21 L23 18 L31 22 L24 27 L25 24 C19 25 15 28 15 34 Z" fill="#005B94"/>

    <!-- Fawry Text -->
    <text x="52" y="27" font-family="'Cairo', system-ui, -apple-system, sans-serif" font-size="19" font-weight="900" fill="#005B94" letter-spacing="-0.5">Fawry</text>
    <text x="54" y="44" font-family="'Brush Script MT', cursive, sans-serif" font-size="18" font-style="italic" font-weight="bold" fill="#781D42">Plus</text>
  </g>

  <!-- Arabic Subtitle -->
  <rect x="20" y="80" width="80" height="24" rx="12" fill="#005B94"/>
  <text x="60" y="96" font-family="'Cairo', system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">دفع فوري • كاش</text>
</svg>
