<!-- Page Module -->
<script type="module">
  import { initPage } from './src/js/core/page-shell.js?v=63fea2cf';
  import { renderContactPage } from './src/js/ui/pages/contact.js?v=63fea2cf';
  import { getCurrentUser } from './src/js/core/auth.js?v=63fea2cf';

  (async () => {
    try {
      await initPage('contact.html');
      await renderContactPage(document.getElementById('page-container'), { user: getCurrentUser() });
    } catch (err) {
      console.error('[ContactBootstrap] Fatal error during page init:', err);
      const pc = document.getElementById('page-container');
      if (pc) {
        pc.innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:1rem;text-align:center;padding:2rem;">
            <p style="font-size:1.1rem;color:var(--text-muted,#888);">حدث خطأ أثناء تحميل الصفحة، يرجى إعادة المحاولة</p>
            <button onclick="location.reload()" style="padding:.6rem 1.5rem;border-radius:8px;background:#1B4F72;color:#fff;border:none;cursor:pointer;">إعادة التحميل</button>
          </div>
        `;
      }
    }
  })();
</script>
