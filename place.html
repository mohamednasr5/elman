  <!-- Pre-Boot Instant Place Fetcher: Dispatched immediately during initial HTML parse -->
  <script>
    (function() {
      try {
        if (window.__INSTANT_PLACE__) {
          document.documentElement.classList.add('has-instant-place');
          if (window.__INSTANT_PLACE__.name) document.title = window.__INSTANT_PLACE__.name + ' | دليل المنزلة والمطرية الرقمي';
          return;
        }
        var params = new URLSearchParams(location.search);
        var slug = (params.get('slug') || params.get('id') || '').trim();
        if (slug && slug !== 'undefined' && slug !== 'null') {
          var clean = slug.toLowerCase();
          var cached = null;
          var raw = sessionStorage.getItem('instant_place_' + clean);
          if (raw) {
            try { cached = JSON.parse(raw); } catch (_) {}
          }
          if (!cached) {
            var rawLatest = sessionStorage.getItem('instant_place_latest');
            if (rawLatest) {
              try {
                var p = JSON.parse(rawLatest);
                if (p && (String(p.slug || '').toLowerCase() === clean || String(p.id || '').toLowerCase() === clean)) {
                  cached = p;
                }
              } catch (_) {}
            }
          }
          if (!cached) {
            try {
              var rawLocal = localStorage.getItem('instant_place_' + clean) || localStorage.getItem('instant_place_latest');
              if (rawLocal) {
                var pl = JSON.parse(rawLocal);
                if (pl && (String(pl.slug || '').toLowerCase() === clean || String(pl.id || '').toLowerCase() === clean || !clean)) {
                  cached = pl;
                }
              }
            } catch (_) {}
          }
          if (!cached) {
            try {
              var rawPool = localStorage.getItem('manzala_verified_showcase_v1');
              if (rawPool) {
                var pool = JSON.parse(rawPool);
                if (Array.isArray(pool)) {
                  for (var i = 0; i < pool.length; i++) {
                    var itm = pool[i];
                    if (itm && (String(itm.slug || '').toLowerCase() === clean || String(itm.id || '').toLowerCase() === clean)) {
                      cached = itm;
                      break;
                    }
                  }
                }
              }
            } catch (_) {}
          }
          if (!cached) {
            try {
              var rawCachedPlaces = localStorage.getItem('dalil_cache_published_100_') || localStorage.getItem('published_100_') || localStorage.getItem('published_1000_');
              if (rawCachedPlaces) {
                var cList = JSON.parse(rawCachedPlaces);
                if (Array.isArray(cList)) {
                  for (var j = 0; j < cList.length; j++) {
                    var itm2 = cList[j];
                    if (itm2 && (String(itm2.slug || '').toLowerCase() === clean || String(itm2.id || '').toLowerCase() === clean)) {
                      cached = itm2;
                      break;
                    }
                  }
                }
              }
            } catch (_) {}
          }

          if (cached) {
            window.__INSTANT_PLACE__ = cached;
            document.documentElement.classList.add('has-instant-place');
            if (cached.name) document.title = cached.name + ' | دليل المنزلة والمطرية الرقمي';
          }

          // Dispatches parallel to stylesheet & module download
          window.__PLACE_PREFETCH_PROMISE__ = fetch('/api/places?slug=' + encodeURIComponent(slug), {
            headers: { 'Accept': 'application/json' }
          }).then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; });
        }
      } catch (_) {}
    })();
  </script>

<script>
  (function() {
    try {
      if (window.__INSTANT_PLACE__) {
        var sp = document.getElementById('splash');
        if (sp) sp.style.display = 'none';
        return;
      }
      var box = document.getElementById('splash-particles');
      if (box) {
        for (var i = 0; i < 24; i++) {
          var p = document.createElement('div');
          p.className = 'particle';
          var s = Math.random() * 4 + 2;
          p.style.width = s + 'px';
          p.style.height = s + 'px';
          p.style.left = (Math.random() * 100) + '%';
          p.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
          p.style.animationDuration = (Math.random() * 4 + 4) + 's';
          p.style.animationDelay = (Math.random() * 4) + 's';
          box.appendChild(p);
        }
      }
    } catch (_) {}
  })();

  window.hideSplash = function() {
    var s = document.getElementById('splash');
    if (s && !s.classList.contains('done')) {
      s.classList.add('done');
      setTimeout(function() {
        if (s && s.parentNode) s.parentNode.removeChild(s);
      }, 650);
    }
  };

  // Safe fallback if network stalls
  setTimeout(function() {
    if (typeof window.hideSplash === 'function') window.hideSplash();
  }, 8000);
</script>

<script type="module">

  (async () => {
    const params = new URLSearchParams(location.search);
    let slug = params.get('slug') || params.get('id') || '';
    if (!slug) {
      const match = location.pathname.match(/\/place\/([^\/?#]+)/);
      if (match && match[1] && match[1] !== 'index.html' && match[1] !== 'place.html') {
        slug = decodeURIComponent(match[1]).trim();
      }
    }
    if (slug === 'undefined' || slug === 'null') slug = '';
    if (!slug && !window.__INSTANT_PLACE__) {
      location.href = '/places.html';
      return;
    }
    if (!slug && window.__INSTANT_PLACE__) {
      slug = window.__INSTANT_PLACE__.slug || window.__INSTANT_PLACE__.id || '';
    }

    const container = document.getElementById('page-container');

    // Concurrently initialize page shell (header, nav, pwa, footer) and render place in 0ms
    const shellPromise = initPage('place.html').catch(err => {
      console.warn('[PlaceBootstrap] Page shell non-fatal error:', err);
    });

    try {
      await renderPlacePage(container, {
        slug,
        user: getCurrentUser(),
        initialPlace: window.__INSTANT_PLACE__
      });

      if (container && !container.querySelector('.place-hero')) {

    await shellPromise;
  })();
