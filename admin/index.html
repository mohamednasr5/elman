<!-- Dedicated Admin Service Worker Registration -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(err => {
      console.debug('[AdminSW] SW registered:', err);
    });
  }
</script>

<!-- Admin App SPA Bootstrap -->
<script type="module">
  import { initAdminApp } from './js/core/router.js';

  document.addEventListener('DOMContentLoaded', () => {
    initAdminApp();
  });
</script>
