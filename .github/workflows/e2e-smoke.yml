name: Browser E2E Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate dashboard parity
        run: node scripts/validate-dashboard-parity.mjs
      - name: Validate modified runtime JavaScript
        run: |
          node --check src/js/ui/pages/places.js
          node --check src/js/ui/components/PlaceCard.js
          node --check src/js/core/db.js
            src/js/utils/maps.js
          node --check src/js/utils/seo.js
          node --check src/js/services/upload.service.js
          node --check src/js/services/image-cdn.service.js
          node --check src/js/core/pwa-install.js
          node --check src/js/services/realtime-sync.service.js
          node --check sw.js
          node --check worker/index.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
