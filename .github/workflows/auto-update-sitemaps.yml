name: Scheduled SEO Sitemaps Auto-Sync

on:
  schedule:
    - cron: '0 3 * * *' # Runs daily at 03:00 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-sitemaps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate updated SEO assets & Sitemaps
        run: node scripts/generate-seo-assets.mjs

      - name: Commit and push updated sitemaps if changed
        run: |
          if git diff --quiet -- sitemap*.xml .indexnow-urls.json; then
            echo "No new sitemap changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add sitemap*.xml .indexnow-urls.json
          git commit -m 'chore(seo): automated daily sitemaps and indexnow sync'
          git push
