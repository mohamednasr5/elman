name: One-time instant reviews fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-reviews-now.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch review loading behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/js/ui/pages/place.js')
          s = p.read_text(encoding='utf-8')
          original = s

          # Never leave the reviews area in an infinite loading state.
          s = re.sub(
              r"\n\s*// Fallback timer: If reviews take > 3\.5s on slow mobile, show graceful retry\n\s*const loadingFallbackTimer = setTimeout\(\(\) => \{.*?\n\s*\}, 3500\);",
              "\n      // Reviews are rendered from cache immediately when available; never show an infinite spinner.\n      const loadingFallbackTimer = null;",
              s,
              flags=re.S,
          )

          s = s.replace(
              "        clearTimeout(loadingFallbackTimer);",
              "        if (loadingFallbackTimer) clearTimeout(loadingFallbackTimer);",
          )

          # If the live request returns no rows, remove the loading indicator instead of showing retry UI.
          s = s.replace(
              "      reviewsFetchPromise.catch(() => {\n        const ind = document.getElementById('reviews-loading-indicator');\n        if (ind && !safeReviews.length) {\n          ind.innerHTML = `<div style=\"padding:1.5rem;color:var(--text-muted)\">تعذر تحميل التقييمات حالياً.</div>`;\n        }\n      });",
              "      reviewsFetchPromise.catch(() => {\n        const ind = document.getElementById('reviews-loading-indicator');\n        if (ind) ind.remove();\n      });"
          )

          if s == original:
              raise SystemExit('No matching review loading block was changed; refusing to commit.')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/js/ui/pages/place.js .github/workflows/fix-reviews-now.yml
          git rm .github/workflows/fix-reviews-now.yml
          git commit -m "fix: never leave place reviews stuck loading"
          git push