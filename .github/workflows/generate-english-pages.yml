name: Generate Bilingual SEO Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bilingual-seo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify published SEO dataset before regeneration
        run: |
          node - <<'NODE'
          const res = await fetch('https://dalilmanzala.com/api/places?limit=1000');
          if (!res.ok) throw new Error(`Published places API returned HTTP ${res.status}`);
          const json = await res.json();
          const rows = Array.isArray(json?.data) ? json.data : [];
          if (rows.length < 1) throw new Error('Published places dataset is empty; refusing to prune generated SEO pages.');
          console.log(`Verified ${rows.length} published places before regeneration.`);
          NODE
      - name: Remove stale generated SEO profile directories
        run: |
          rm -rf place/* category/* en/place/* en/category/*
          mkdir -p place category en/place en/category
      - name: Generate Arabic static SEO business/category pages
        run: node build-seo-pages.mjs
      - name: Generate English SEO-aware pages
        run: node generate-english-pages.mjs
      - name: Harden Arabic canonical and hreflang signals
        run: node scripts/harden-arabic-seo.mjs
      - name: Generate bilingual sitemaps and indexing manifest
        run: node scripts/generate-seo-assets.mjs
      - name: Validate SEO assets
        run: |
          node --check build-seo-pages.mjs
          node --check generate-english-pages.mjs
          node --check scripts/harden-arabic-seo.mjs
          node --check scripts/generate-seo-assets.mjs
          node --check scripts/submit-indexnow.mjs
          node --check scripts/validate-seo.mjs
          node scripts/validate-seo.mjs
      - name: Commit generated SEO assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en place category sitemap*.xml .indexnow-urls.json rss.xml || true
          git add '*.html' || true
          if git diff --cached --quiet; then
            echo "No generated SEO changes."
            exit 0
          fi
          git commit -m "chore(seo): refresh bilingual indexable pages and sitemaps"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Notify IndexNow
        run: node scripts/submit-indexnow.mjs
