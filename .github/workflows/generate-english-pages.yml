name: Generate English Static Pages
on:
  push:
    branches: [main, feature/complete-english-frontend]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate English frontend
        run: |
          node scripts/validate-english-frontend.mjs
          node --check generate-english-pages.mjs
          node --check src/js/core/english-pages.js
          node --check src/js/core/english-data.js
          node --check src/js/core/english-audit.js
          node --check src/js/ui/components/en/PlaceCardEn.js
          node --check src/js/ui/pages/en/city-en.js
          node --check src/js/ui/pages/en/place-en-v2.js
      - name: Generate dedicated English pages
        run: node generate-english-pages.mjs
      - name: Commit generated English pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en
          if git diff --cached --quiet; then
            echo "No English page changes to commit."
          else
            git commit -m "Generate English static page entries"
            git push
          fi
