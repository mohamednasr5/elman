name: One-time certificate dashboard fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fix certificate dashboard opening and preview sizing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dash = Path('src/js/ui/pages/dashboard.js')
          text = dash.read_text(encoding='utf-8')
          old = '''  // Bind Certificate of Appreciation modal for places in dashboard
  $container.querySelectorAll('.btn-dash-cert').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const pid = btn.dataset.placeId;
      const targetPlace = places.find(p => (p.id || p._key) === pid);
      if (targetPlace) {
        openCertificateOfAppreciationModal(targetPlace, {});
      }
    });
  });'''
          new = '''  // Bind Certificate of Appreciation modal for places in dashboard.
  // Use delegated handling so dynamically rendered/re-rendered buttons always work.
  if (!$container.dataset.certificateClickBound) {
    $container.dataset.certificateClickBound = 'true';
    $container.addEventListener('click', (e) => {
      const btn = e.target.closest('.btn-dash-cert');
      if (!btn || !$container.contains(btn)) return;
      e.preventDefault();
      e.stopPropagation();

      const pid = String(btn.dataset.placeId || '').trim();
      const targetPlace = places.find(p => String(p.id || p._key || '').trim() === pid);
      if (!targetPlace) {
        console.error('[Dashboard] Certificate place not found:', pid);
        toast.error('تعذر العثور على بيانات المكان لعرض الشهادة.');
        return;
      }

      try {
        openCertificateOfAppreciationModal(targetPlace, {});
      } catch (err) {
        console.error('[Dashboard] Failed to open certificate modal:', err);
        toast.error('تعذر فتح شهادة التقدير. حاول مرة أخرى.');
      }
    });
  }'''
          if old not in text:
              raise SystemExit('dashboard target block not found')
          dash.write_text(text.replace(old, new, 1), encoding='utf-8')

          cert = Path('src/js/ui/components/CertificateOfAppreciationModal.js')
          ctext = cert.read_text(encoding='utf-8')
          marker = '</style>'
          css = '''

      /* Responsive certificate preview: keep the full A4 sheet visible in the modal.
         The export/print renderer remains untouched, so downloaded certificates keep
         their existing high-resolution layout. */
      .certificate-preview-container {
        flex: 1 1 auto !important;
        min-height: 0 !important;
        width: 100% !important;
        box-sizing: border-box !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        overflow: auto !important;
        padding: 16px !important;
      }

      .certificate-preview-container .certificate-sheet {
        width: min(840px, calc(100vw - 72px)) !important;
        min-width: 0 !important;
        max-width: 100% !important;
        height: auto !important;
        max-height: calc(100vh - 190px) !important;
        aspect-ratio: 297 / 210 !important;
        box-sizing: border-box !important;
        flex: 0 1 auto !important;
      }

      @media (max-width: 700px) {
        .certificate-modal-overlay {
          padding: 6px !important;
          align-items: center !important;
        }
        .certificate-modal-dialog {
          width: 100% !important;
          max-width: 100% !important;
          max-height: calc(100vh - 12px) !important;
          border-radius: 14px !important;
        }
        .certificate-modal-toolbar {
          padding: 9px 10px !important;
          gap: 7px !important;
        }
        .certificate-preview-container {
          padding: 8px !important;
        }
        .certificate-preview-container .certificate-sheet {
          width: min(840px, calc(100vw - 28px)) !important;
          max-height: calc(100vh - 145px) !important;
        }
      }
'''
          idx = ctext.rfind(marker)
          if idx < 0:
              raise SystemExit('certificate style marker not found')
          if 'Responsive certificate preview: keep the full A4 sheet visible' not in ctext:
              ctext = ctext[:idx] + css + ctext[idx:]
              cert.write_text(ctext, encoding='utf-8')
          else:
              print('certificate CSS already present')

          print('Certificate dashboard fix applied.')
          PY

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-certificate-dashboard.yml
          git add src/js/ui/pages/dashboard.js src/js/ui/components/CertificateOfAppreciationModal.js .github/workflows/fix-certificate-dashboard.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix dashboard certificate modal and responsive preview"
          git push
