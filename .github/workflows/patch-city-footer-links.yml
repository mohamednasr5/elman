name: Add city guide links to footer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch footer links
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [Path('src/js/core/page-shell.js'), Path('src/js/core/page-shell.pretty.js')]
          replacements = [
              ("        ['/en/around-me/', 'Near Me'],\n        ['/en/favorites/', 'Favorites']",
               "        ['/en/around-me/', 'Near Me'],\n        ['/en/manzala/', 'About El Manzala'],\n        ['/en/matariya/', 'About El Matariya'],\n        ['/en/favorites/', 'Favorites']"),
              ("        ['/around-me.html', 'اكتشف حولك'],\n        ['/favorites.html', 'المفضلة']",
               "        ['/around-me.html', 'اكتشف حولك'],\n        ['/manzala.html', 'عن المنزلة'],\n        ['/matariya.html', 'عن المطرية'],\n        ['/favorites.html', 'المفضلة']")
          ]

          for path in paths:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'Footer patterns not found in {path}')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time patch workflow
        run: git rm .github/workflows/patch-city-footer-links.yml

      - name: Commit footer links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/js/core/page-shell.js src/js/core/page-shell.pretty.js
          git commit -m "Add Manzala and Matariya links to footer"
          git commit --amend --no-edit
          git push
