name: Apply Contact Page CSS Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-contact-css:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted contact page layout fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/css/pages/contact.css')
          css = path.read_text(encoding='utf-8')
          marker = '/* CONTACT PAGE PRECISION LAYOUT FIX 2026-09-11 */'
          if marker not in css:
              css += r'''

/* CONTACT PAGE PRECISION LAYOUT FIX 2026-09-11 */

/* Service listing card: give Arabic content a deliberate visual hierarchy */
.place-add-service-card {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto 48px;
  padding: 34px 38px;
  box-sizing: border-box;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(210px, 250px);
  align-items: center;
  gap: 30px;
  direction: rtl;
  text-align: right;
  border-radius: 24px;
  overflow: hidden;
}

.place-add-service-card__content {
  min-width: 0;
  position: relative;
  z-index: 1;
}

.place-add-service-card__eyebrow {
  display: inline-flex;
  align-items: center;
  margin-bottom: 10px;
  font-size: clamp(0.78rem, 1.2vw, 0.92rem);
  line-height: 1.5;
  font-weight: 800;
  white-space: normal;
}

.place-add-service-card__title {
  margin: 0 0 12px;
  max-width: 900px;
  font-size: clamp(1.65rem, 3.1vw, 2.55rem);
  line-height: 1.38;
  font-weight: 900;
  letter-spacing: -0.25px;
  overflow-wrap: anywhere;
  text-wrap: balance;
}

.place-add-service-card__desc {
  max-width: 900px;
  margin: 0 0 18px;
  font-size: clamp(0.9rem, 1.35vw, 1.05rem);
  line-height: 1.95;
  font-weight: 500;
  overflow-wrap: anywhere;
}

.place-add-service-card__features {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 9px 16px;
  max-width: 900px;
  line-height: 1.7;
}

.place-add-service-card__features span {
  white-space: nowrap;
}

.place-add-service-card__action {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: center;
  gap: 9px;
  text-align: center;
  position: relative;
  z-index: 1;
}

.place-add-service-card__btn {
  width: 100%;
  min-height: 52px;
  padding: 12px 18px;
  font-size: 0.98rem;
  font-weight: 800;
  line-height: 1.4;
  white-space: normal;
  border-radius: 14px;
}

.place-add-service-card__action small {
  display: block;
  font-size: 0.76rem;
  line-height: 1.65;
  opacity: 0.78;
}

/* Contact form heading: prevent the large Arabic heading from looking cramped */
#contact-form-section {
  width: 100%;
}

.contact-form-card {
  width: 100%;
  max-width: 900px;
  margin-inline: auto;
  box-sizing: border-box;
  padding: clamp(26px, 4vw, 42px);
  border-radius: 24px;
}

.contact-form-card > div:first-child {
  max-width: 820px;
  margin-inline: auto;
}

.contact-form-title {
  max-width: 780px;
  margin: 10px auto 10px;
  font-size: clamp(1.45rem, 3vw, 2.15rem);
  line-height: 1.55;
  font-weight: 900;
  letter-spacing: -0.2px;
  overflow-wrap: anywhere;
  text-wrap: balance;
}

.contact-form-desc {
  max-width: 680px;
  margin: 0 auto;
  font-size: clamp(0.86rem, 1.3vw, 1rem);
  line-height: 1.85;
  overflow-wrap: anywhere;
}

.contact-form-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  max-width: 100%;
  line-height: 1.55;
  white-space: normal;
  text-align: center;
}

@media (max-width: 820px) {
  .place-add-service-card {
    grid-template-columns: 1fr;
    gap: 22px;
    padding: 28px 24px;
    text-align: center;
  }

  .place-add-service-card__content,
  .place-add-service-card__desc,
  .place-add-service-card__features {
    margin-inline: auto;
  }

  .place-add-service-card__features {
    justify-content: center;
  }

  .place-add-service-card__action {
    max-width: 360px;
    width: 100%;
    margin-inline: auto;
  }
}

@media (max-width: 560px) {
  .place-add-service-card {
    margin-bottom: 34px;
    padding: 24px 18px;
    border-radius: 20px;
  }

  .place-add-service-card__title {
    font-size: 1.45rem;
    line-height: 1.5;
  }

  .place-add-service-card__desc {
    font-size: 0.88rem;
    line-height: 1.9;
  }

  .place-add-service-card__features {
    gap: 7px 12px;
    font-size: 0.82rem;
  }

  .contact-form-card {
    padding: 22px 16px;
    border-radius: 20px;
  }

  .contact-form-title {
    font-size: 1.35rem;
    line-height: 1.6;
  }
}
'''
              path.write_text(css, encoding='utf-8')
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/css/pages/contact.css
          git rm .github/workflows/contact-css-fix.yml
          git commit -m "Fix contact page Arabic layout and typography"
          git push