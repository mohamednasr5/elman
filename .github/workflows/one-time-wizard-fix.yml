name: One-time Add Place Wizard Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dashboard wizard activation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/js/ui/pages/dashboard.js')
          s = p.read_text(encoding='utf-8')

          old = "import { showAddPlaceOnboardingModal } from '../components/AddPlaceOnboardingModal.js';"
          new = "import { initPlaceFormWizard } from '../components/AddPlaceOnboardingModal.js';"
          if old not in s:
              raise SystemExit('expected onboarding import not found')
          s = s.replace(old, new, 1)

          old = """    } else if (section === 'add' || section === 'add-place') {\n      await renderPlaceFormSection($mainArea, _dashUser, null);\n    } else if (section === 'edit' || section === 'edit-place') {\n      await renderPlaceFormSection($mainArea, _dashUser, placeId);"""
          new = """    } else if (section === 'add' || section === 'add-place') {\n      await renderPlaceFormSection($mainArea, _dashUser, null);\n      requestAnimationFrame(() => initPlaceFormWizard());\n    } else if (section === 'edit' || section === 'edit-place') {\n      await renderPlaceFormSection($mainArea, _dashUser, placeId);\n      requestAnimationFrame(() => initPlaceFormWizard());"""
          if old not in s:
              raise SystemExit('expected section rendering block not found')
          s = s.replace(old, new, 1)

          old = """  // Show 3D Onboarding Guide for first-time place creators\n  if (!isEdit) {\n    setTimeout(() => {\n      showAddPlaceOnboardingModal(false);\n    }, 150);\n  }\n"""
          if old not in s:
              raise SystemExit('expected onboarding block not found')
          s = s.replace(old, "", 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit dashboard fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/js/ui/pages/dashboard.js
          git commit -m "fix: activate progressive place form wizard" || true
          rm -f .github/workflows/one-time-wizard-fix.yml
          git add -A
          git commit -m "chore: remove one-time wizard fixer" || true
          git push
