name: One-time rating sort fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fix unrated places sorting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'src/js/ui/pages/places.js': [
                  ("sorted = filtered.sort((a, b) => (Number(b.rating) || 5.0) - (Number(a.rating) || 5.0));",
                   "sorted = filtered.sort((a, b) => { const ra = Number(a.rating ?? a.stats?.rating); const rb = Number(b.rating ?? b.stats?.rating); const ca = Number(a.reviewCount ?? a.review_count ?? a.reviewsCount ?? a.stats?.reviewCount ?? 0); const cb = Number(b.reviewCount ?? b.review_count ?? b.reviewsCount ?? b.stats?.reviewCount ?? 0); const va = Number.isFinite(ra) && ca > 0 ? ra : 0; const vb = Number.isFinite(rb) && cb > 0 ? rb : 0; return vb - va || cb - ca; });"),
                  ("sorted = filtered.sort((a, b) => (Number(a.rating) || 5.0) - (Number(b.rating) || 5.0));",
                   "sorted = filtered.sort((a, b) => { const ra = Number(a.rating ?? a.stats?.rating); const rb = Number(b.rating ?? b.stats?.rating); const ca = Number(a.reviewCount ?? a.review_count ?? a.reviewsCount ?? a.stats?.reviewCount ?? 0); const cb = Number(b.reviewCount ?? b.review_count ?? b.reviewsCount ?? b.stats?.reviewCount ?? 0); const va = Number.isFinite(ra) && ca > 0 ? ra : 0; const vb = Number.isFinite(rb) && cb > 0 ? rb : 0; return va - vb || ca - cb; });"),
              ],
              'src/js/ui/pages/categories.js': [
                  ("places.sort((a, b) => (Number(b.rating) || 5.0) - (Number(a.rating) || 5.0));",
                   "places.sort((a, b) => { const ra = Number(a.rating ?? a.stats?.rating); const rb = Number(b.rating ?? b.stats?.rating); const ca = Number(a.reviewCount ?? a.review_count ?? a.reviewsCount ?? a.stats?.reviewCount ?? 0); const cb = Number(b.reviewCount ?? b.review_count ?? b.reviewsCount ?? b.stats?.reviewCount ?? 0); const va = Number.isFinite(ra) && ca > 0 ? ra : 0; const vb = Number.isFinite(rb) && cb > 0 ? rb : 0; return vb - va || cb - ca; });"),
                  ("places.sort((a, b) => (Number(a.rating) || 5.0) - (Number(b.rating) || 5.0));",
                   "places.sort((a, b) => { const ra = Number(a.rating ?? a.stats?.rating); const rb = Number(b.rating ?? b.stats?.rating); const ca = Number(a.reviewCount ?? a.review_count ?? a.reviewsCount ?? a.stats?.reviewCount ?? 0); const cb = Number(b.reviewCount ?? b.review_count ?? b.reviewsCount ?? b.stats?.reviewCount ?? 0); const va = Number.isFinite(ra) && ca > 0 ? ra : 0; const vb = Number.isFinite(rb) && cb > 0 ? rb : 0; return va - vb || ca - cb; });"),
              ],
              'src/js/ui/pages/search.js': [
                  ("places.sort((a, b) => (Number(b.rating) || 5.0) - (Number(a.rating) || 5.0));",
                   "places.sort((a, b) => { const ra = Number(a.rating ?? a.stats?.rating); const rb = Number(b.rating ?? b.stats?.rating); const ca = Number(a.reviewCount ?? a.review_count ?? a.reviewsCount ?? a.stats?.reviewCount ?? 0); const cb = Number(b.reviewCount ?? b.review_count ?? b.reviewsCount ?? b.stats?.reviewCount ?? 0); const va = Number.isFinite(ra) && ca > 0 ? ra : 0; const vb = Number.isFinite(rb) && cb > 0 ? rb : 0; return vb - va || cb - ca; });"),
              ],
          }

          changed = []
          for name, pairs in replacements.items():
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  changed.append(name)

          print('Changed:', ', '.join(changed) if changed else 'none')
          if not changed:
              raise SystemExit(0)
          PY

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-rating-sort.yml
          git add src/js/ui/pages/places.js src/js/ui/pages/categories.js src/js/ui/pages/search.js .github/workflows/fix-rating-sort.yml
          git commit -m "Fix highest-rated sorting for unrated places"
          git push
