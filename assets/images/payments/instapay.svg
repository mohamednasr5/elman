<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="instaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E1B8C"/>
      <stop offset="50%" stop-color="#46106E"/>
      <stop offset="100%" stop-color="#2D0848"/>
    </linearGradient>
    <linearGradient id="instaArrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5733"/>
      <stop offset="100%" stop-color="#FFA033"/>
    </linearGradient>
    <radialGradient id="instaGlow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="instaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#2D0848" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#instaBg)" filter="url(#instaShadow)"/>
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#instaGlow)"/>
  <rect x="7" y="7" width="106" height="106" rx="25" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>

  <!-- InstaPay Stylized "i" and chevron arrows -->
  <g transform="translate(26, 24)">
    <!-- Dot of the i -->
    <rect x="5" y="2" width="14" height="7" rx="3.5" fill="#FFFFFF"/>
    <!-- Stem of the i -->
    <rect x="5" y="13" width="14" height="26" rx="3.5" fill="#FFFFFF"/>

    <!-- Arrow 1 (Peach/Orange) -->
    <path d="M26 13 L36 26 L26 39 L31 39 L41 26 L31 13 Z" fill="url(#instaArrow)"/>
    <!-- Arrow 2 (Orange/Amber) -->
    <path d="M38 13 L48 26 L38 39 L43 39 L53 26 L43 13 Z" fill="#FFA033"/>
    <!-- Top Bar of P -->
    <rect x="53" y="13" width="15" height="26" rx="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <text x="60" y="86" font-family="'Cairo', system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">INSTAPAY</text>
  <text x="60" y="103" font-family="'Cairo', system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#FCD34D" text-anchor="middle">انستاباي لحظي</text>
</svg>
