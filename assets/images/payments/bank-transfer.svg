<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bankBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="arrowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="bankGlow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="bankShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#bankBg)" filter="url(#bankShadow)"/>
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#bankGlow)"/>
  <rect x="7" y="7" width="106" height="106" rx="25" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- Twin Bank Buildings & Transfer Arrows -->
  <g transform="translate(18, 16)">
    <!-- Top Arrow -->
    <path d="M22 8 C38 -2 58 4 64 16 L58 16 L68 22 L72 11 L66 11 C60 0 36 -6 18 4 Z" fill="url(#arrowCyan)"/>

    <!-- Left Bank Building -->
    <g transform="translate(0, 14)">
      <!-- Roof Triangle -->
      <path d="M18 0 L0 10 L36 10 Z" fill="#F1F5F9"/>
      <!-- Dollar Column Center -->
      <rect x="3" y="10" width="30" height="20" fill="#E2E8F0" rx="1"/>
      <text x="18" y="25" font-family="'Cairo', Arial, sans-serif" font-size="14" font-weight="900" fill="#0F172A" text-anchor="middle">$</text>
      <!-- Base -->
      <rect x="0" y="30" width="36" height="4" fill="#CBD5E1" rx="1"/>
    </g>

    <!-- Right Bank Building -->
    <g transform="translate(48, 14)">
      <!-- Roof Triangle -->
      <path d="M18 0 L0 10 L36 10 Z" fill="#F1F5F9"/>
      <!-- Dollar Column Center -->
      <rect x="3" y="10" width="30" height="20" fill="#E2E8F0" rx="1"/>
      <text x="18" y="25" font-family="'Cairo', Arial, sans-serif" font-size="14" font-weight="900" fill="#0F172A" text-anchor="middle">$</text>
      <!-- Base -->
      <rect x="0" y="30" width="36" height="4" fill="#CBD5E1" rx="1"/>
    </g>

    <!-- Bottom Arrow -->
    <path d="M62 46 C46 56 26 50 20 38 L26 38 L16 32 L12 43 L18 43 C24 54 48 60 66 50 Z" fill="url(#arrowCyan)"/>
  </g>

  <!-- Subtitle -->
  <text x="60" y="87" font-family="'Cairo', system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">تحويل بنكي</text>
  <text x="60" y="103" font-family="'Cairo', system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#38BDF8" text-anchor="middle">حسابات وبنوك مصر</text>
</svg>
