<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="visaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3ECA"/>
      <stop offset="50%" stop-color="#0E2AA0"/>
      <stop offset="100%" stop-color="#081A6E"/>
    </linearGradient>
    <linearGradient id="chipGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE78A"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <radialGradient id="visaGlow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="visaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#081A6E" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#visaBg)" filter="url(#visaShadow)"/>
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#visaGlow)"/>
  <rect x="7" y="7" width="106" height="106" rx="25" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>

  <!-- Golden Chip Mini -->
  <rect x="22" y="24" width="16" height="12" rx="2.5" fill="url(#chipGold)"/>
  <line x1="22" y1="30" x2="38" y2="30" stroke="#B8960C" stroke-width="0.8"/>
  <line x1="30" y1="24" x2="30" y2="36" stroke="#B8960C" stroke-width="0.8"/>

  <!-- Contactless waves -->
  <path d="M44 26 A8 8 0 0 1 44 34" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M48 23 A12 12 0 0 1 48 37" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- VISA Bold Typography with iconic golden V-serif -->
  <g transform="translate(18, 48)">
    <text x="42" y="24" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" font-style="italic" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">VISA</text>
    <!-- Gold flick on top of V -->
    <path d="M9 3 L16 3 L12 11 Z" fill="#FBBF24"/>
  </g>

  <!-- Subtitle -->
  <text x="60" y="102" font-family="'Cairo', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#93C5FD" text-anchor="middle">فيزا وبطاقات بنكية</text>
</svg>
