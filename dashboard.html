<script>
  window.ServerValue = window.ServerValue || { TIMESTAMP: Date.now() };

  // The dashboard historically referenced .png defaults, while the actual
  // repository assets are JPEG files. Keep a resilient runtime fallback for
  // dynamically-rendered dashboard previews and old cached markup.
  document.addEventListener('error', function (event) {
    const img = event.target;
    if (!(img instanceof HTMLImageElement) || img.dataset.defaultFallbackApplied === '1') return;
    const src = img.getAttribute('src') || '';
    let fallback = '';
    if (/assets\/images\/default-logo\.png(?:[?#].*)?$/i.test(src)) {
      fallback = src.replace(/default-logo\.png/i, 'default-logo.jpg');
    } else if (/assets\/images\/default-cover\.png(?:[?#].*)?$/i.test(src)) {
      fallback = src.replace(/default-cover\.png/i, 'default-cover.jpg');
    }
    if (!fallback) return;
    img.dataset.defaultFallbackApplied = '1';
    img.src = fallback;
  }, true);
</script>
<script src="./src/js/services/description-ai-guard.js?v=128bb341"></script>
<script src="./src/js/services/description-ai-response-guard.js?v=128bb341"></script>
<script type="module">
  import { initPage } from './src/js/core/page-shell.js?v=128bb341';
  import { initDashboardHeaderAuthNotifications } from './src/js/core/dashboard-header-fix.js?v=128bb341';
  import { renderDashboard } from './src/js/ui/pages/dashboard.js?v=128bb341';
  import './src/js/ui/pages/dashboard-certificate-fix.js?v=128bb341';
  import { waitForAuth } from './src/js/core/auth.js';
  import { initGoogleMapsLocationPicker } from './src/js/ui/components/GoogleMapsLocationPicker.js?v=128bb341';
  // Fast path: Synchronous check for cached user to achieve 0ms First Contentful Paint
  let cachedUser = null;
  try {
    const raw = localStorage.getItem('manzala_persistent_user');
    if (raw) cachedUser = JSON.parse(raw);
  } catch (_) {}

  const params = new URLSearchParams(location.search);
  const section = params.get('section') || 'overview';
  const placeId = params.get('id') || null;

  // Initialize page shell concurrently
  const shellPromise = initPage('dashboard.html').catch(console.error);

  if (cachedUser && cachedUser.uid) {
    // 1. Instant render without blocking on network or FCM
    renderDashboard(document.getElementById('page-container'), { user: cachedUser, section, placeId })
      .then(() => {
        try { initGoogleMapsLocationPicker(); } catch (_) {}
      })
      .catch(console.error);

    // 2. Refresh auth & notifications in background
    initDashboardHeaderAuthNotifications().catch(console.error);
    await shellPromise;
  } else {
    // No cached user: wait for shell, race waitForAuth with 3.5s timeout to prevent endless spinning
    await shellPromise;
    initDashboardHeaderAuthNotifications().catch(console.error);
    const user = await Promise.race([
      waitForAuth(),
      new Promise(resolve => setTimeout(() => resolve(null), 3500))
    ]);
    if (!user) {
      window.location.replace('login.html');
    } else {
      await renderDashboard(document.getElementById('page-container'), { user, section, placeId });
      try { initGoogleMapsLocationPicker(); } catch (_) {}
    }
  }
</script>
