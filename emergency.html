<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دليل الطوارئ والخدمات | دليل المنزلة والمطرية</title>
<meta name="description" content="أرقام الطوارئ والجهات والخدمات المهمة في مصر — اتصال مباشر من دليل المنزلة والمطرية.">
<link rel="stylesheet" href="./src/css/main.css?v=2.6.0">
<style>
:root{--emg-navy:#102a43;--emg-blue:#1479b8;--emg-cyan:#19b5c5;--emg-muted:#64748b;--emg-line:rgba(16,42,67,.09)}
.emg{max-width:1180px;margin:auto;padding:20px 18px 90px}
.emg-hero{position:relative;isolation:isolate;overflow:hidden;min-height:270px;border-radius:32px;margin:10px 0 28px;padding:42px;color:#fff;background:linear-gradient(135deg,#0d253d,#123e62 48%,#087f9b);box-shadow:0 25px 80px rgba(16,42,67,.18)}
.emg-hero:before{content:"";position:absolute;inset:-45%;z-index:-1;background:conic-gradient(from 180deg,transparent 0 55%,rgba(25,181,197,.16),transparent 72%);animation:emgOrbit 14s linear infinite}
.emg-hero:after{content:"";position:absolute;width:420px;height:420px;left:-190px;bottom:-300px;border:1px solid rgba(255,255,255,.18);border-radius:50%;box-shadow:0 0 0 42px rgba(255,255,255,.035),0 0 0 88px rgba(255,255,255,.025)}
@keyframes emgOrbit{to{transform:rotate(360deg)}} 
.emg-badge{display:inline-flex;padding:7px 12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);backdrop-filter:blur(12px);border-radius:999px;font-size:11px;font-weight:800}
.emg-title{font-size:clamp(30px,5vw,54px);line-height:1.15;font-weight:950;margin:18px 0 10px;letter-spacing:-1.2px}.emg-title span{color:#7de7ef}.emg-sub{max-width:690px;color:rgba(255,255,255,.76);line-height:1.95;font-size:13px;margin:0}
.emg-siren{position:absolute;left:48px;top:38px;width:145px;height:145px;display:grid;place-items:center;border-radius:42px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(14px);font-size:62px;box-shadow:inset 0 1px rgba(255,255,255,.15);animation:emgFloat 4s ease-in-out infinite}
.emg-siren:after{content:"";position:absolute;inset:14px;border:1px solid rgba(125,231,239,.3);border-radius:32px;animation:emgPulse 2.6s ease-out infinite}
@keyframes emgFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(2deg)}}@keyframes emgPulse{0%{transform:scale(.82);opacity:.8}80%,100%{transform:scale(1.15);opacity:0}}
.emg-tools{display:flex;gap:10px;align-items:center;margin:0 0 24px;padding:10px;border:1px solid var(--emg-line);background:rgba(255,255,255,.55);border-radius:22px;box-shadow:0 10px 35px rgba(16,42,67,.06);backdrop-filter:blur(16px)}
.emg-search{flex:1;min-width:220px;padding:14px 17px;border-radius:15px;border:1px solid var(--emg-line);background:rgba(255,255,255,.8);color:var(--emg-navy);font:inherit;font-size:12px;outline:none;transition:.25s}.emg-search:focus{border-color:rgba(20,121,184,.4);box-shadow:0 0 0 4px rgba(20,121,184,.08)}
.emg-section{margin-top:32px}.emg-section h2{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:950;color:var(--emg-navy);margin:0 0 14px}.emg-section h2>span{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,rgba(20,121,184,.11),rgba(25,181,197,.13));border:1px solid rgba(20,121,184,.12);font-size:20px}
.emg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.emg-card{position:relative;overflow:hidden;min-height:185px;padding:17px;border-radius:21px;background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(248,251,253,.78));border:1px solid var(--emg-line);box-shadow:0 8px 30px rgba(16,42,67,.055);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s}.emg-card:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--emg-cyan),transparent);transform:translateX(-100%);transition:transform .55s}.emg-card:hover{transform:translateY(-7px);box-shadow:0 20px 45px rgba(16,42,67,.12);border-color:rgba(20,121,184,.2)}.emg-card:hover:before{transform:translateX(100%)}
.emg-icon{width:53px;height:53px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(145deg,#eef8fb,#f5fbfd);border:1px solid rgba(20,121,184,.11);font-size:25px;box-shadow:inset 0 1px rgba(255,255,255,.9);animation:emgFloat 4s ease-in-out infinite}.emg-name{font-weight:900;font-size:12.5px;color:var(--emg-navy);margin:12px 0 5px;line-height:1.55}.emg-num{font-size:22px;font-weight:950;letter-spacing:.6px;color:var(--emg-blue);direction:ltr;text-align:right}
.emg-call{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:11px;padding:10px;border-radius:13px;background:linear-gradient(135deg,#0e7490,#1479b8);color:#fff;text-decoration:none;font-size:11px;font-weight:900;box-shadow:0 8px 20px rgba(20,121,184,.16);transition:.25s}.emg-call:hover{transform:translateY(-2px);box-shadow:0 11px 24px rgba(20,121,184,.25)}.emg-note{font-size:9px;color:var(--emg-muted);margin-top:7px}.emg-empty{padding:50px;text-align:center;color:var(--emg-muted);border:1px dashed var(--emg-line);border-radius:22px}
@media(max-width:1000px){.emg-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.emg{padding:8px 11px 60px}.emg-hero{min-height:auto;padding:25px 20px;border-radius:24px}.emg-siren{position:relative;left:auto;top:auto;width:76px;height:76px;border-radius:22px;font-size:35px;margin-bottom:15px}.emg-siren:after{inset:8px;border-radius:17px}.emg-title{font-size:31px}.emg-sub{font-size:11px}.emg-tools{padding:8px;border-radius:17px}.emg-grid{grid-template-columns:repeat(2,1fr);gap:9px}.emg-card{min-height:171px;padding:12px}.emg-num{font-size:18px}.emg-section h2{font-size:16px}}@media(max-width:420px){.emg-grid{grid-template-columns:1fr}.emg-title{font-size:28px}.emg-tools{flex-direction:column;align-items:stretch}.emg-search{min-width:0}}@media(prefers-reduced-motion:reduce){.emg-hero:before,.emg-siren,.emg-siren:after,.emg-icon{animation:none}.emg-card,.emg-call{transition:none}}[data-theme="dark"] .emg-tools{background:rgba(15,35,55,.72)}[data-theme="dark"] .emg-card{background:linear-gradient(145deg,#12263a,#102235);border-color:rgba(148,163,184,.12)}[data-theme="dark"] .emg-section h2,[data-theme="dark"] .emg-name{color:#e2e8f0}[data-theme="dark"] .emg-search{background:#0f2235;color:#e2e8f0}
</style>
</head>
<body>
<div id="app"><div id="header-slot"></div><main id="page-container"></main><div id="nav-slot"></div><div id="footer-slot"></div></div>
<script type="module">
import { initPage } from './src/js/core/page-shell.js?v=2.6.0';
await initPage('emergency.html');

const groups=[
['🚨','أرقام الطوارئ الأساسية',[
['الأمن العام','115'],['وزارة الداخلية','138'],['دار الإفتاء المصرية','107'],['الاسم الرقمي','122'],['الإسعاف','123']]],
['🏛️','الهيئات والوزارات والخدمات',[
['الهيئة العامة للتأمين الصحي','106'],['وزارة التربية والتعليم','19151'],['الهيئة العامة لتعليم الكبار','19556'],['وزارة السياحة','19654'],['وزارة الدفاع','19136'],['وزارة البيئة','19808'],['الهيئة العامة للتأمين الصحي','19806'],['وزارة التربية والتعليم','19126'],['جامعة القاهرة - مركز التعليم المفتوح','19545'],['الهيئة العامة للخدمات البيطرية','19561'],['وزارة التجارة والصناعة','19805'],['هيئة الرقابة الإدارية','16100'],['هيئة سوق المال','16916'],['البريد المصري','16789'],['الهيئة القومية للتأمينات الاجتماعية','16217'],['الهيئة العامة للاستثمار','16035'],['هيئة تنمية صناعة تكنولوجيا المعلومات','16248'],['الصندوق الاجتماعي للتنمية','19733'],['الهيئة العامة للرقابة على الصادرات','19591'],['مبيعات كبار العملاء','19526'],['الهيئة المصرية للرقابة على التأمين','19053'],['مجلس التدريب الصناعي','16456'],['تكنولوجيا تشغيل المنشآت المالية والمرافق والخدمات','19680']]],
['👮','المباحث والخدمات الأمنية',[
['سرقات المتاجر','4243479'],['سرقات السيارات','4268822'],['جرائم النشل','4268822'],['قسم مكافحة المخدرات','4269966'],['جرائم الأموال العامة','4203208'],['جرائم الآداب','4269955'],['جرائم المصنفات الفنية','4268305'],['مباحث المرور','4949547'],['شرطة المرافق','4244322'],['مباحث التهرب الضريبي','4843222'],['الإسعاف','3925810'],['عمليات المرور','01200103633'],['شرطة التموين','4204669']]],
['💻','مباحث الإنترنت',[
['مباحث الإنترنت','0227921487'],['مباحث الإنترنت','0227921490'],['مباحث الإنترنت','0227921490']]],
['🛡️','الأمن الوطني',[
['الأمن الوطني','022645000'],['الأمن الوطني','022646000'],['الأمن الوطني','022647000']]]
];

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>String(s).replace(/\s/g,'').replace(/[()\-]/g,'');
document.getElementById('page-container').innerHTML=`
<div class="emg">
<div class="page-back-bar"><button class="btn-page-back" onclick="history.length>1?history.back():location.href='index.html'">← رجوع</button></div>
<section class="emg-hero"><div class="emg-siren" aria-hidden="true">◉</div><span class="emg-badge">✦ دليل الطوارئ والخدمات · مصر</span><h1 class="emg-title">حين تحتاج الرقم الصحيح… <span>تجده فورًا.</span></h1><p class="emg-sub">واجهة سريعة ومباشرة لأرقام الطوارئ والجهات والخدمات المهمة. اضغط على أي رقم لإجراء الاتصال مباشرة من هاتفك.</p></section>
<div class="emg-tools"><input id="emg-search" class="emg-search" placeholder="🔎 ابحث عن هيئة أو خدمة أو رقم..." autocomplete="off"><button id="emg-reset" class="btn btn-secondary">إظهار الكل</button></div>
<div id="emg-content"></div>
<div class="emg-note">تنبيه: الأرقام المعروضة أُدرجت وفق البيانات المقدمة للدليل. في الحالات الخطرة، استخدم أرقام الطوارئ الرسمية المعروفة وتحقق من الرقم عند الحاجة.</div>
</div>`;
function render(q=''){
 const needle=normalize(q.toLowerCase());
 let total=0; const html=groups.map(([icon,title,items])=>{
   const filtered=items.filter(([n,num])=>!needle||normalize((n+' '+num).toLowerCase()).includes(needle));
   if(!filtered.length)return '';
   total+=filtered.length;
   return `<section class="emg-section"><h2><span>${icon}</span>${esc(title)} <small style="font-size:11px;color:var(--text-muted)">(${filtered.length})</small></h2><div class="emg-grid">${filtered.map(([name,num],i)=>`<article class="emg-card"><div class="emg-icon">${icon==='🚨'?'◉':icon==='🏛️'?'▣':icon==='👮'?'♙':icon==='💻'?'⌁':'⬡'}</div><div class="emg-name">${esc(name)}</div><div class="emg-num">${esc(num)}</div><a class="emg-call" href="tel:${esc(num)}">اتصال مباشر  ↗</a><div class="emg-note">خدمة اتصال سريع من الهاتف</div></article>`).join('')}</div></section>`;
 }).join('');
 document.getElementById('emg-content').innerHTML=html||'<div class="emg-empty">لا توجد نتيجة مطابقة لبحثك.</div>';
}
render();
document.getElementById('emg-search').addEventListener('input',e=>render(e.target.value));
document.getElementById('emg-reset').addEventListener('click',()=>{document.getElementById('emg-search').value='';render()});
</script>
</body></html>
