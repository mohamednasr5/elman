let active='core';
function render(){const q=norm(document.getElementById('e-search').value);const targetGroups=active==='all'?groups:groups.filter(g=>g[0]===active);const smartMatch=(name,num)=>{if(!q)return true;const hay=norm(name+' '+num);if(hay.includes(q))return true;const aliases={'اسعاف':'الإسعاف المصرية','الاسعاف':'الإسعاف المصرية','اسعاف مصر':'الإسعاف المصرية','مطافي':'المطافئ المصرية','المطافي':'المطافئ المصرية','نجده':'شرطة النجدة','النجده':'شرطة النجدة','شرطه':'شرطة النجدة','امن':'الأمن العام','الامن':'الأمن العام','مرور':'حوادث المرور','مياه':'شكاوى المياه','كهربا':'شكاوى الكهرباء','كهرباء':'شكاوى الكهرباء','غاز':'شكاوى الغاز','تليفونات':'مباحث التليفونات','انترنت':'مباحث الإنترنت','امن وطني':'الأمن الوطني','طيران':'خدمات الطيران','صحه':'خدمات الصحة','صحه':'خدمات الصحة'};const alias=aliases[q];if(alias&&norm(name).includes(norm(alias)))return true;const tokens=q.match(/.{1,3}/g)||[];return tokens.length>1&&tokens.filter(t=>hay.includes(t)).length>=Math.ceil(tokens.length*.7)};const html=targetGroups.map(([key,title,items])=>{const rows=items.filter(([n,num])=>smartMatch(n,num));if(!rows.length)return '';return `<section class="e-section"><div class="e-section-head"><div class="e-section-title"><span class="ico"><svg viewBox="0 0 24 24" width="21" height="21">${iconFor[key]}</svg></span>${esc(title)}</div><span class="e-count">${rows.length} جهة / خدمة</span></div><div class="e-list">${rows.map(([name,num],i)=>`<article class="e-card" style="animation-delay:${i*35}ms"><div class="e-card-icon"><svg viewBox="0 0 24 24">${iconFor[key]}</svg></div><div><div class="e-card-name">${esc(name)}</div><div class="e-card-kind">اتصال مباشر من الهاتف</div></div><div class="e-card-calls">${String(num).split("/").map(phone=>phone.trim()).filter(Boolean).map(phone=>`<a class="e-call" href="tel:${esc(phone.replace(/[^0-9+]/g,""))}">${callSvg}<strong>${esc(phone)}</strong><span>اتصال</span></a>`).join("")}</div></article>`).join('')}</div></section>`}).join('');document.getElementById('directory').innerHTML=html||'<div class="e-empty">لا توجد نتيجة مطابقة. جرّب اسم الجهة أو آخر أرقام الهاتف.</div>'}
const radarNumbers=['122','123','115'];
const radarBox=document.getElementById('e-radar-number');
let radarIndex=0;
function showRadarNumber(){
  if(!radarBox)return;
  const number=radarNumbers[radarIndex++%radarNumbers.length];
  const angle=(radarIndex*137.5)%360;
  const radius=34;
  const rad=angle*Math.PI/180;
  const x=50+Math.cos(rad)*radius;
  const y=50+Math.sin(rad)*radius;
  radarBox.style.left=x+'%';
  radarBox.style.top=y+'%';
  radarBox.querySelector('strong').textContent=number;
  radarBox.classList.remove('show');
  void radarBox.offsetWidth;
  radarBox.classList.add('show');
  clearTimeout(showRadarNumber.hideTimer);
  showRadarNumber.hideTimer=setTimeout(()=>radarBox.classList.remove('show'),1700);
}
setTimeout(showRadarNumber,450);
setInterval(showRadarNumber,2200);
render();
document.getElementById('e-search').addEventListener('input',()=>{render();});document.getElementById('e-reset').addEventListener('click',()=>{document.getElementById('e-search').value='';render()});
